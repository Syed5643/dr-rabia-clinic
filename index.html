const parseDrug = (s) => {
  const parts = s.split("|");
  const brandName = parts[0];
  const genericSalt = parts[1] || "";
  const d = parts[2] || "101";
  const timing = parts[3] || "After Food";
  const days = Number(parts[4]) || 3;
  return { brandName, genericSalt, m: d[0] === "1", a: d[1] === "1", n: d[2] === "1", timing, days };
};

function Odontogram({ selected = [], onToggle, chart = {} }) {
  const tooth = (num) => {
    const s = String(num), st = chart[s]?.status, on = selected.includes(s);
    let c = "bg-white text-slate-700 border-slate-300";
    if (st === "RCT") c = "bg-amber-100 text-amber-900 border-amber-400 font-bold";
    if (st === "Caries") c = "bg-rose-100 text-rose-900 border-rose-400 font-bold";
    if (st === "Extracted") c = "bg-slate-200 text-slate-400 border-dashed border-slate-400 line-through";
    if (on) c = "bg-teal-600 text-white border-teal-700 shadow font-bold";
    return <button key={num} type="button" onClick={() => onToggle && onToggle(s)} title={`Tooth #${num}${st ? " (" + st + ")" : ""}`}
      className={`w-8 h-11 sm:w-9 sm:h-12 text-[11px] rounded border transition ${c}`}>{num}</button>;
  };
  const row = (a, b, cls = "") => (
    <div className={`flex justify-center items-center gap-1 overflow-x-auto no-scrollbar ${cls}`}>
      <div className="flex gap-1">{a.map(tooth)}</div><div className="w-px h-8 bg-slate-300 mx-1"></div><div className="flex gap-1">{b.map(tooth)}</div>
    </div>);
  return (
    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
      <p className="text-xs font-bold text-slate-600 mb-2">Odontogram — tap teeth to select</p>
      {row(TEETH.ur, TEETH.ul, "pb-2 border-b border-dashed border-slate-300")}
      {row(TEETH.lr, TEETH.ll, "pt-2")}
    </div>);
}

const Field = ({ label, ...p }) => (
  <div><label className="text-xs font-semibold text-slate-600">{label}</label>
    <input {...p} className="w-full mt-1 p-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" /></div>);

function App() {
  const [user, setUser] = useState(() => { try { return JSON.parse(sessionStorage.getItem("rabia_auth_user")); } catch (e) { return null; } });
  const [login, setLogin] = useState({ username: "", password: "" });
  const [loginError, setLoginError] = useState("");
  const [tab, setTab] = useState(4); // Default to Doctor Operatory tab
  const [patients, setPatients] = useState(() => load("rabia_patients_v10", INITIAL_PATIENTS));
  const [appts, setAppts] = useState(() => load("rabia_appts_v10", INITIAL_APPOINTMENTS));
  const [reminders, setReminders] = useState(() => load("rabia_reminders_v10", INITIAL_REMINDERS));
  const [toast, setToast] = useState(null);
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(null);
  const [printModalPt, setPrintModalPt] = useState(null);

  // Taxonomy Custom Categories & Procedures
  const [categories, setCategories] = useState(() => load("rabia_custom_cats_v10", DEFAULT_CATS));

  const blankPt = { name: "", phone: "", age: "", gender: "Female", chartNo: "", complaint: "", allergies: "" };
  const [newPt, setNewPt] = useState(blankPt);
  const blankApt = { name: "", phone: "", date: "2026-10-07", time: "11:30 AM", doctor: "Dr. Rabia", complaint: "" };
  const [newApt, setNewApt] = useState(blankApt);

  const [op, setOp] = useState({
    patientId: "p0",
    department: "Oral & Maxillofacial Surgery",
    procedure: "Routine Intra-Alveolar Extraction",
    teeth: ["38"],
    notes: ""
  });

  const [meds, setMeds] = useState([]);
  const [rec, setRec] = useState(false);
  const [audio, setAudio] = useState(null);
  const mrRef = useRef(null), chunks = useRef([]);
  const [custom, setCustom] = useState(() => load("rabia_custom_drugs_v10", []));
  const [dq, setDq] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [cd, setCd] = useState({ brandName: "", genericSalt: "", timing: "After Food" });
  const [showCatDrawer, setShowCatDrawer] = useState(false);

  // Persist State
  const persist = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  useEffect(() => persist("rabia_patients_v10", patients), [patients]);
  useEffect(() => persist("rabia_appts_v10", appts), [appts]);
  useEffect(() => persist("rabia_custom_drugs_v10", custom), [custom]);
  useEffect(() => persist("rabia_reminders_v10", reminders), [reminders]);
  useEffect(() => persist("rabia_custom_cats_v10", categories), [categories]);

  const say = (msg) => { setToast({ msg }); setTimeout(() => setToast(null), 3000); };

  const doLogin = (e) => {
    e.preventDefault();
    const c = CREDS.find(x => x.user === login.username.trim().toLowerCase() && x.pass === login.password);
    if (!c) return setLoginError("Invalid credentials.");
    const u = { user: c.user, role: c.role, name: c.name };
    setUser(u); sessionStorage.setItem("rabia_auth_user", JSON.stringify(u)); setLoginError("");
  };

  const logout = () => { sessionStorage.removeItem("rabia_auth_user"); setUser(null); setLogin({ username: "", password: "" }); };

  const allDrugs = [...ALL_DRUGS, ...custom];
  const inRx = (b) => meds.some(m => m.brandName === b);
  const tapDrug = (d) => {
    if (inRx(d.brandName)) return say(`${d.brandName} is already added`);
    setMeds(p => [...p, newMed(d)]);
  };

  const setMed = (id, patch) => setMeds(p => p.map(m => m.id === id ? { ...m, ...patch } : m));
  const dropMed = (id) => setMeds(p => p.filter(m => m.id !== id));
  const toggleTooth = (t) => setOp(p => ({ ...p, teeth: p.teeth.includes(t) ? p.teeth.filter(x => x !== t) : [...p.teeth, t] }));

  // Dynamic Category & Procedure Addition
  const handleAddNewCategory = () => {
    const newCat = prompt("Enter new Dental Specialty Category name:");
    if (!newCat || !newCat.trim()) return;
    const catName = newCat.trim();
    if (categories[catName]) return say("Category already exists");
    
    const initialProc = prompt(`Enter first procedure for "${catName}":`);
    const procName = (initialProc && initialProc.trim()) ? initialProc.trim() : "General Consultation";
    
    const updated = { ...categories, [catName]: [procName] };
    setCategories(updated);
    setOp(prev => ({ ...prev, department: catName, procedure: procName }));
    say(`Added specialty: ${catName}`);
  };

  const handleAddNewProcedure = () => {
    const newProc = prompt(`Enter new procedure for current category (${op.department}):`);
    if (!newProc || !newProc.trim()) return;
    const procName = newProc.trim();
    const existingList = categories[op.department] || [];
    if (existingList.includes(procName)) return say("Procedure already exists in this category");

    const updated = { ...categories, [op.department]: [...existingList, procName] };
    setCategories(updated);
    setOp(prev => ({ ...prev, procedure: procName }));
    say(`Added procedure: ${procName}`);
  };

  // Voice recording
  const startRec = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(stream); mrRef.current = mr; chunks.current = [];
      mr.ondataavailable = (e) => e.data.size && chunks.current.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const r = new FileReader();
        r.onloadend = () => { setAudio(r.result); say("Voice memo attached"); };
        r.readAsDataURL(new Blob(chunks.current, { type: mr.mimeType || "audio/webm" }));
      };
      mr.start(); setRec(true);
    } catch (e) { alert("Microphone permission required for voice notes."); }
  };
  const stopRec = () => { if (mrRef.current && rec) { mrRef.current.stop(); setRec(false); } };

  const saveTreatment = (e) => {
    e.preventDefault();
    const pt = patients.find(p => p.id === op.patientId) || patients[0];
    if (!op.teeth.length) return say("Tap at least one tooth on the odontogram");
    const tooth = op.teeth.join(", ");
    const visit = {
      date: new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }),
      department: op.department,
      procedure: op.procedure,
      tooth,
      notes: op.notes || "Procedure completed successfully.",
      medicines: meds,
      voiceMemo: audio
    };
    const chart = { ...(pt.dentalChart || {}) };
    op.teeth.forEach(t => {
      chart[t] = { status: /RCT/.test(op.procedure) ? "RCT" : /Extraction|Odontectomy/.test(op.procedure) ? "Extracted" : "Treated", notes: op.procedure };
    });
    const updatedPt = { ...pt, status: "Ready for Rx Print", dentalChart: chart, visits: [visit, ...(pt.visits || [])] };
    setPatients(patients.map(p => p.id === pt.id ? updatedPt : p));
    setPrintModalPt(updatedPt);
    setMeds([]); setAudio(null); setOp(p => ({ ...p, notes: "", teeth: [] }));
    setTab(3);
    say("Saved & sent to Reception for printing!");
  };

  const addPatient = (e) => {
    e.preventDefault();
    const c = {
      id: "p_" + Date.now(),
      name: newPt.name,
      phone: newPt.phone,
      age: Number(newPt.age) || "",
      gender: newPt.gender,
      chartNo: newPt.chartNo || "20261007_" + Math.floor(100000 + Math.random() * 900000),
      medicalHistory: "None reported",
      allergies: newPt.allergies.split(",").map(s => s.trim()).filter(Boolean),
      conditions: [],
      complaint: newPt.complaint || "Routine evaluation",
      status: "Waiting in Lobby",
      dentalChart: {},
      visits: []
    };
    setPatients([c, ...patients]);
    setSel(c);
    setNewPt(blankPt);
    say("Patient record created");
  };

  const addAppt = (e) => {
    e.preventDefault();
    setAppts([{ id: "apt-" + Date.now(), ...newApt, status: "Confirmed" }, ...appts]);
    setNewApt(blankApt);
    say("Appointment confirmed");
  };

  const admit = (a) => {
    const c = {
      id: "p_" + Date.now(),
      name: a.name,
      phone: a.phone,
      age: 30,
      gender: "Female",
      chartNo: "20261007_" + Math.floor(100000 + Math.random() * 900000),
      medicalHistory: "None reported",
      allergies: [],
      conditions: [],
      complaint: a.complaint || "Scheduled consultation",
      status: "Waiting in Lobby",
      dentalChart: {},
      visits: []
    };
    setPatients([c, ...patients]);
    setAppts(appts.map(x => x.id === a.id ? { ...x, status: "Arrived / In Clinic" } : x));
    setSel(c);
    setTab(3);
  };

  const wa = (phone, text) => {
    const p = phone.replace(/\D/g, "");
    window.open(`https://wa.me/${p.length === 10 ? "91" + p : p}?text=${encodeURIComponent(text)}`, "_blank");
  };
  const sms = (phone, text, id) => {
    if (id) setReminders(reminders.map(r => r.id === id ? { ...r, status: "Sent", timing: "Sent just now" } : r));
    window.location.href = `sms:${phone}?body=${encodeURIComponent(text)}`;
  };
  const aftercareMsg = (name, procedure, tooth, dept) =>
    `*Dr. Rabia's Dental Care, Tindivanam*\n\nHello ${name},\nஉங்கள் சிகிச்சைக்குப் பின் கவனிக்க வேண்டியவை — ${procedure} (Tooth #${tooth}):\n\n${tamilFor(dept)}\n\nஅவசர உதவி / Emergency: ${PHONE}`;

  const term = dq.trim().toLowerCase();
  const searchResults = term.length < 2 ? [] : allDrugs.filter(d => (d.brandName + " " + d.genericSalt).toLowerCase().includes(term)).slice(0, 16);

  if (!user) return (
    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
      <form onSubmit={doLogin} className="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 space-y-4">
        <div className="text-center">
          <div className="inline-flex w-14 h-14 bg-teal-600 text-white rounded-2xl items-center justify-center text-2xl mb-2 font-bold shadow-md">🦷</div>
          <h1 className="text-xl font-bold">Dr. Rabia's Dental Care</h1>
          <p className="text-xs text-slate-500">Authorized staff only · confidential patient data</p>
        </div>
        {loginError && <div className="p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl">{loginError}</div>}
        <Field label="Staff User ID" required value={login.username} onChange={e => setLogin({ ...login, username: e.target.value })} />
        <Field label="Password" type="password" required value={login.password} onChange={e => setLogin({ ...login, password: e.target.value })} />
        <button className="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-sm transition">Unlock clinic portal</button>
      </form>
    </div>
  );

  const fp = patients.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || p.phone.includes(q) || (p.chartNo || "").includes(q));
  const chairPt = patients.find(p => p.id === op.patientId) || patients[0];
  const modalPt = printModalPt || chairPt;
  const lvModal = modalPt?.visits?.[0];

  const alerts = (p) => p && (p.allergies?.length > 0 || p.conditions?.length > 0) && (
    <div className="bg-rose-50 border-l-4 border-rose-600 p-2.5 rounded-r-lg">
      <p className="text-[11px] font-bold text-rose-800">⚠️ Clinical risk alert — {p.name}</p>
      <div className="flex flex-wrap gap-1 mt-1">
        {p.allergies?.map(a => <span key={a} className="bg-rose-200 text-rose-900 text-[10px] font-bold px-1.5 py-0.5 rounded">Allergy: {a}</span>)}
        {p.conditions?.map(c => <span key={c} className="bg-amber-200 text-amber-900 text-[10px] font-semibold px-1.5 py-0.5 rounded">{c}</span>)}
      </div>
    </div>
  );

  const rxList = (v) => (v && v.medicines) ? v.medicines.map((m, i) => (
    <p key={i} className="text-[10px] font-mono text-teal-900">• {m.brandName} [ {doseStr(m, " - ")} ] {m.timing} × {m.days}d</p>
  )) : null;

  const TABS = [
    [1, "Overview", "📊"],
    [2, "Appointments", "📅", appts.filter(a => a.status === "Confirmed").length],
    [3, "Patients & EHR", "👥", patients.filter(p => p.status === "Ready for Rx Print").length],
    [4, "Doctor Operatory (Logs)", "🩺"],
    [5, "Reminders", "🔔", reminders.filter(r => r.status === "Pending").length],
    [6, "Google Reviews", "⭐"]
  ];

  return (
    <div>
      <div className="app-chrome min-h-screen flex flex-col bg-[#f8fafc] text-slate-800">
        <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
          <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="bg-teal-600 text-white p-2 rounded-xl text-lg font-bold">🦷</div>
              <div>
                <h1 className="font-bold text-lg leading-tight text-slate-900">Dr. Rabia's Dental Care</h1>
                <p className="text-xs text-slate-500 font-medium">Tindivanam Clinic Portal & EzDent Bridge</p>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <div className="text-right hidden sm:block">
                <p className="text-xs font-bold text-slate-900">{user.name}</p>
                <p className="text-[10px] text-teal-700 font-semibold">{user.role}</p>
              </div>
              <button onClick={logout} className="text-xs bg-rose-50 hover:bg-rose-100 text-rose-700 font-semibold px-3 py-1.5 rounded-lg border border-rose-200 transition">Sign out</button>
            </div>
          </div>
          <div className="max-w-6xl mx-auto px-4 flex gap-1 sm:gap-4 overflow-x-auto text-sm font-semibold border-t border-slate-100 no-scrollbar">
            {TABS.map(([id, label, ic, badge]) => (
              <button key={id} onClick={() => setTab(id)} className={`py-3 px-3 border-b-2 flex items-center gap-2 whitespace-nowrap transition ${tab === id ? "border-teal-600 text-teal-700 bg-teal-50/50" : "border-transparent text-slate-500 hover:text-slate-800"}`}>
                <span>{ic}</span>{label}{badge > 0 && <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded-full">{badge}</span>}
              </button>
            ))}
          </div>
        </header>

        {toast && <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-sm">✓ {toast.msg}</div>}

        <main className="max-w-5xl mx-auto w-full p-4 sm:p-6 flex-1">

          {/* TAB 1: OVERVIEW */}
          {tab === 1 && (
            <div className="space-y-6">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {[
                  ["Total patients", patients.length, "text-slate-900"],
                  ["Appointments", appts.length, "text-teal-700"],
                  ["Ready to print", patients.filter(p => p.status === "Ready for Rx Print").length, "text-amber-600"],
                  ["Google rating", "4.9 ★", "text-slate-900"]
                ].map(([l, v, c]) => (
                  <div key={l} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs text-slate-500 font-semibold uppercase">{l}</p>
                    <p className={`text-2xl font-bold mt-1 ${c}`}>{v}</p>
                  </div>
                ))}
              </div>
              <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <h3 className="text-base font-bold mb-3 flex justify-between items-center">
                  <span>Recent Treatments</span>
                  <button onClick={() => setTab(4)} className="text-xs text-teal-700 font-semibold hover:underline">Open operatory →</button>
                </h3>
                <div className="divide-y divide-slate-100">
                  {patients.flatMap(p => (p.visits || []).map(v => ({ v, p }))).slice(0, 4).map(({ v, p }, i) => (
                    <div key={i} className="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-sm">
                      <div>
                        <p className="font-semibold">{p.name} — <span className="text-teal-700">{v.procedure}</span></p>
                        <p className="text-xs text-slate-500">Tooth #{v.tooth} · Chart {p.chartNo}</p>
                        {rxList(v)}
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => setPrintModalPt(p)} className="px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-semibold transition">🔍 Preview & Print Rx</button>
                        <button onClick={() => wa(p.phone, aftercareMsg(p.name, v.procedure, v.tooth, v.department))} className="px-3 py-2 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-xs font-semibold transition">WhatsApp</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: APPOINTMENTS */}
          {tab === 2 && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden self-start shadow-sm">
                {appts.map(a => (
                  <div key={a.id} className="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="font-bold text-sm text-slate-900">{a.name}</span>
                        <span className="text-[10px] bg-teal-50 text-teal-800 font-semibold px-2 py-0.5 rounded border border-teal-200">{a.time}</span>
                        <span className="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{a.date}</span>
                      </div>
                      <p className="text-xs text-slate-500 mt-1">📞 {a.phone} · {a.doctor}</p>
                      <p className="text-xs text-slate-600">Complaint: {a.complaint || "General checkup"}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      {a.status !== "Arrived / In Clinic" ? (
                        <button onClick={() => admit(a)} className="px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold transition">Admit to queue</button>
                      ) : (
                        <span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1.5 rounded-lg border border-emerald-200">✓ Admitted</span>
                      )}
                      <button onClick={() => wa(a.phone, `Hello ${a.name}, your dental appointment with ${a.doctor} at Dr. Rabia's Dental Care Tindivanam is on ${a.date} at ${a.time}. Location: ${MAPS}`)} className="px-3 py-2 bg-emerald-100 text-emerald-800 hover:bg-emerald-200 rounded-lg text-xs font-bold transition">Notify</button>
                    </div>
                  </div>
                ))}
              </div>
              <form onSubmit={addAppt} className="bg-white p-5 rounded-xl border border-slate-200 space-y-3 self-start shadow-sm">
                <h3 className="font-bold text-sm border-b pb-2">Book New Appointment</h3>
                <Field label="Patient name" required value={newApt.name} onChange={e => setNewApt({ ...newApt, name: e.target.value })} />
                <div className="grid grid-cols-2 gap-2">
                  <Field label="Phone (10 digits)" type="tel" required value={newApt.phone} onChange={e => setNewApt({ ...newApt, phone: e.target.value })} />
                  <Field label="Time" required value={newApt.time} onChange={e => setNewApt({ ...newApt, time: e.target.value })} />
                </div>
                <Field label="Date" type="date" required value={newApt.date} onChange={e => setNewApt({ ...newApt, date: e.target.value })} />
                <Field label="Chief concern" value={newApt.complaint} onChange={e => setNewApt({ ...newApt, complaint: e.target.value })} />
                <button className="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold transition">Confirm booking</button>
              </form>
            </div>
          )}

          {/* TAB 3: PATIENTS & EHR */}
          {tab === 3 && (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 space-y-4">
                <input placeholder="Search name, phone or EzDent chart no…" value={q} onChange={e => setQ(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-teal-500 focus:outline-none shadow-sm" />
                <div className="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden shadow-sm">
                  {fp.map(pt => (
                    <div key={pt.id} onClick={() => setSel(pt)} className={`p-4 hover:bg-slate-50 cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${sel?.id === pt.id ? "bg-teal-50/70 border-l-4 border-teal-600" : ""}`}>
                      <div>
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className="font-bold">{pt.name}</span>
                          <span className="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-semibold">{pt.gender}, {pt.age}y</span>
                          <span className="text-[10px] font-mono bg-teal-50 text-teal-800 border border-teal-200 px-1.5 py-0.5 rounded">{pt.chartNo}</span>
                          {pt.status === "Ready for Rx Print" && <span className="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full animate-pulse">Ready to print Rx</span>}
                        </div>
                        <p className="text-xs text-slate-500 mt-1">📞 {pt.phone} · {pt.medicalHistory}</p>
                      </div>
                      {pt.visits && pt.visits.length > 0 && (
                        <button onClick={(e) => { e.stopPropagation(); setPrintModalPt(pt); }} className="px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold shrink-0 shadow-sm transition">🔍 Preview & Print</button>
                      )}
                    </div>
                  ))}
                </div>
              </div>

              <div className="self-start">
                {sel ? (
                  <div className="bg-white p-5 rounded-xl border border-slate-200 space-y-4 shadow-sm">
                    <div className="flex justify-between border-b pb-3">
                      <h3 className="font-bold text-slate-900">EHR Patient Chart</h3>
                      <button onClick={() => setSel(null)} className="text-xs text-slate-500 hover:text-slate-800">Close ✕</button>
                    </div>
                    {alerts(sel)}
                    <div>
                      <p className="text-lg font-bold text-slate-900">{sel.name}</p>
                      <p className="text-xs text-slate-500">{sel.phone} · {sel.age}y · {sel.gender}</p>
                      <p className="text-xs font-mono text-teal-800">Chart: {sel.chartNo}</p>
                    </div>
                    <Odontogram selected={[]} onToggle={() => {}} chart={sel.dentalChart} />
                    <div className="flex gap-2">
                      {sel.visits && sel.visits.length > 0 && (
                        <button onClick={() => setPrintModalPt(sel)} className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold transition">🔍 Preview & Print</button>
                      )}
                      <button onClick={() => { setOp(p => ({ ...p, patientId: sel.id })); setTab(4); }} className="flex-1 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold transition">Log Treatment</button>
                    </div>
                  </div>
                ) : (
                  <form onSubmit={addPatient} className="bg-white p-5 rounded-xl border border-slate-200 space-y-3 shadow-sm">
                    <h3 className="font-bold text-sm border-b pb-2">Register Walk-in Patient</h3>
                    <Field label="Full name" required value={newPt.name} onChange={e => setNewPt({ ...newPt, name: e.target.value })} />
                    <div className="grid grid-cols-2 gap-2">
                      <Field label="Phone" type="tel" required value={newPt.phone} onChange={e => setNewPt({ ...newPt, phone: e.target.value })} />
                      <Field label="Age" type="number" required value={newPt.age} onChange={e => setNewPt({ ...newPt, age: e.target.value })} placeholder="23" />
                    </div>
                    <Field label="EzDent chart no" value={newPt.chartNo} onChange={e => setNewPt({ ...newPt, chartNo: e.target.value })} />
                    <button className="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-xs font-bold transition">Save patient record</button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* TAB 4: DOCTOR OPERATORY WITH DYNAMIC ADD CATEGORY & PROCEDURE */}
          {tab === 4 && (
            <form onSubmit={saveTreatment} className="space-y-4">
              
              {/* Patient in Chair Selection */}
              <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                <div>
                  <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Patient in Chair</span>
                  <div className="flex items-center gap-2 mt-0.5">
                    <select 
                      value={op.patientId} 
                      onChange={e => setOp({ ...op, patientId: e.target.value, teeth: [] })}
                      className="font-bold text-sm text-slate-900 bg-transparent border-b border-dashed border-teal-500 focus:outline-none"
                    >
                      {patients.map(p => <option key={p.id} value={p.id}>{p.name} ({p.gender}, {p.age}y)</option>)}
                    </select>
                    <span className="font-mono text-xs bg-teal-50 text-teal-800 px-2 py-0.5 rounded border border-teal-200">
                      Chart: {chairPt.chartNo}
                    </span>
                  </div>
                </div>

                {printModalPt && (
                  <button 
                    type="button" 
                    onClick={() => setPrintModalPt(chairPt)}
                    className="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-xs font-bold shadow transition"
                  >
                    Preview Last Rx Slip
                  </button>
                )}
              </div>

              {/* 32-Tooth Odontogram */}
              <Odontogram selected={op.teeth} onToggle={toggleTooth} chart={chairPt?.dentalChart} />

              {/* ======================================================== */}
              {/* 1. TOP CARD: Specialty Category & Clinical Procedure */}
              {/* ======================================================== */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="block text-xs font-bold text-slate-700">
                        Specialty Category
                      </label>
                      <button
                        type="button"
                        onClick={handleAddNewCategory}
                        className="text-[11px] font-bold text-teal-700 hover:text-teal-900 hover:underline"
                      >
                        + Add category
                      </button>
                    </div>
                    <div className="relative">
                      <select
                        value={op.department}
                        onChange={e => {
                          const dept = e.target.value;
                          setOp({ ...op, department: dept, procedure: (categories[dept] && categories[dept][0]) || "General Consultation" });
                        }}
                        className="w-full appearance-none bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 shadow-sm"
                      >
                        {Object.keys(categories).map(cat => (
                          <option key={cat} value={cat}>{cat}</option>
                        ))}
                      </select>
                      <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                      </div>
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="block text-xs font-bold text-slate-700">
                        Clinical Procedure
                      </label>
                      <button
                        type="button"
                        onClick={handleAddNewProcedure}
                        className="text-[11px] font-bold text-teal-700 hover:text-teal-900 hover:underline"
                      >
                        + Add procedure
                      </button>
                    </div>
                    <div className="relative">
                      <select
                        value={op.procedure}
                        onChange={e => setOp({ ...op, procedure: e.target.value })}
                        className="w-full appearance-none bg-white border border-slate-300 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 shadow-sm"
                      >
                        {(categories[op.department] || []).map(pr => (
                          <option key={pr} value={pr}>{pr}</option>
                        ))}
                      </select>
                      <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* ======================================================== */}
              {/* 2. MIDDLE CARD: Drug Search & One-Tap Palette (94 Formulations) */}
              {/* ======================================================== */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-slate-900">
                    Drug Search & One–Tap Palette (94 Formulations)
                  </h3>
                  <span className="text-xs font-semibold text-teal-600">
                    Tap adds formulation
                  </span>
                </div>

                {/* Input Search & Add Drug Button */}
                <div className="flex items-center gap-3">
                  <div className="relative flex-1">
                    <input
                      type="text"
                      value={dq}
                      onChange={e => setDq(e.target.value)}
                      placeholder="Type 2 letters — au, pan, flag, syp..."
                      className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 shadow-sm"
                    />
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowAdd(true)}
                    className="px-4 py-2.5 bg-[#0f172a] hover:bg-slate-800 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm whitespace-nowrap"
                  >
                    + Add clinic drug
                  </button>
                </div>

                {/* Dynamic Real-time Search Box */}
                {term.length >= 2 && (
                  <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <p className="text-[11px] font-bold text-slate-500 mb-1.5">Matching Formulations:</p>
                    <div className="flex flex-wrap gap-1.5">
                      {searchResults.map(d => (
                        <button
                          type="button"
                          key={d.brandName}
                          onClick={() => tapDrug(d)}
                          className={`px-3 py-1.5 rounded-xl border text-xs font-semibold transition active:scale-95 ${
                            inRx(d.brandName) 
                              ? "bg-teal-600 text-white border-teal-700" 
                              : "bg-white text-slate-800 border-slate-300 hover:border-teal-500"
                          }`}
                        >
                          {inRx(d.brandName) ? "✓ " : "+ "}{d.brandName}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* Daily Quick-Tap Formulations Pills */}
                <div>
                  <p className="text-[11px] font-bold text-slate-600 mb-2">
                    Daily Quick–Tap Formulations
                  </p>
                  <div className="flex flex-wrap gap-2">
                    {PRESETS.map(b => allDrugs.find(d => d.brandName === b)).filter(Boolean).map(drug => (
                      <button
                        key={drug.brandName}
                        type="button"
                        onClick={() => tapDrug(drug)}
                        className={`px-3 py-1.5 rounded-xl border text-xs font-semibold shadow-sm transition-all active:scale-95 ${
                          inRx(drug.brandName)
                            ? "bg-teal-600 text-white border-teal-700 shadow"
                            : "bg-white text-slate-800 border-slate-200 hover:border-teal-500"
                        }`}
                      >
                        {inRx(drug.brandName) ? "✓ " : "+ "}{drug.brandName}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Expandable Category Drawer */}
                <div className="border border-slate-200 rounded-xl p-3 bg-white">
                  <button
                    type="button"
                    onClick={() => setShowCatDrawer(!showCatDrawer)}
                    className="w-full flex justify-between items-center text-xs font-bold text-slate-800 focus:outline-none"
                  >
                    <span>Browse all 75+ drugs by category</span>
                    <svg className={`w-4 h-4 text-slate-500 transition-transform ${showCatDrawer ? "rotate-180" : ""}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                  </button>

                  {showCatDrawer && (
                    <div className="space-y-3 mt-3 pt-3 border-t border-slate-100 max-h-60 overflow-y-auto">
                      {Object.keys(DRUG_GROUPS).map(group => (
                        <div key={group}>
                          <p className="text-[11px] font-bold text-slate-600 mb-1">{group}</p>
                          <div className="flex flex-wrap gap-1.5">
                            {allDrugs.filter(d => d.group === group).map(d => (
                              <button
                                type="button"
                                key={d.brandName}
                                onClick={() => tapDrug(d)}
                                className={`px-2.5 py-1 rounded-lg border text-[11px] font-medium transition ${
                                  inRx(d.brandName) ? "bg-teal-600 text-white border-teal-700" : "bg-white text-slate-700 border-slate-200 hover:border-teal-500"
                                }`}
                              >
                                {inRx(d.brandName) ? "✓ " : "+ "}{d.brandName}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Modal: Custom Drug */}
                {showAdd && (
                  <div className="fixed inset-0 z-40 bg-black/50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl p-5 w-full max-w-md space-y-3 max-h-[90vh] overflow-y-auto shadow-2xl">
                      <h4 className="font-bold text-sm">Add Clinic Drug to Stock</h4>
                      <Field label="Brand name" value={cd.brandName} onChange={e => setCd({ ...cd, brandName: e.target.value })} />
                      <Field label="Generic composition (printed on slip)" value={cd.genericSalt} onChange={e => setCd({ ...cd, genericSalt: e.target.value })} placeholder="e.g. Tab. Paracetamol 500 mg" />
                      <div>
                        <p className="text-xs font-semibold text-slate-600 mb-1">Default timing</p>
                        <div className="flex flex-wrap gap-1.5">
                          {TIMINGS.map(t => <button type="button" key={t} onClick={() => setCd({ ...cd, timing: t })} className={`min-h-[38px] px-3 rounded-lg border text-xs font-semibold ${cd.timing === t ? "bg-teal-600 text-white" : "bg-white"}`}>{t}</button>)}
                        </div>
                      </div>
                      <div className="flex gap-2 pt-2">
                        <button type="button" onClick={() => {
                          const b = cd.brandName.trim(), g = cd.genericSalt.trim();
                          if (!b || !g) return say("Both brand and generic are required");
                          setCustom([...custom, { brandName: b, genericSalt: g, m: true, a: false, n: true, timing: cd.timing, days: 3, group: CUSTOM_GROUP }]);
                          setCd({ brandName: "", genericSalt: "", timing: "After Food" }); setShowAdd(false); say(`${b} saved to stock`);
                        }} className="flex-1 py-2.5 bg-teal-600 text-white rounded-lg text-xs font-bold">Save to stock</button>
                        <button type="button" onClick={() => setShowAdd(false)} className="px-4 py-2.5 bg-slate-100 rounded-lg text-xs font-bold">Cancel</button>
                      </div>
                    </div>
                  </div>
                )}

                <div className="border-t border-slate-100 my-2"></div>

                {/* ======================================================== */}
                {/* 3. BOTTOM SECTION: Prescription (X) */}
                {/* ======================================================== */}
                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-slate-900">
                    Prescription ({meds.length})
                  </h4>

                  {meds.length === 0 ? (
                    <div className="p-4 border-2 border-dashed border-slate-200 rounded-xl text-center bg-slate-50/50">
                      <p className="text-xs text-slate-400 italic font-medium">
                        Nothing prescribed. Tap a drug above.
                      </p>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {meds.map((m, idx) => (
                        <div key={m.id} className="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2 text-xs">
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="font-bold text-slate-900 text-xs">{idx + 1}. {m.brandName}</span>
                              <p className="text-[10px] text-slate-500 italic mt-0.5">{composition(m)}</p>
                            </div>
                            <button
                              type="button"
                              onClick={() => dropMed(m.id)}
                              className="text-slate-400 hover:text-rose-600 px-2 py-1 text-sm font-bold"
                            >
                              ✕
                            </button>
                          </div>

                          <div className="flex flex-wrap items-center gap-2 pt-1 border-t border-slate-200/60">
                            <div className="flex items-center gap-1 bg-white p-1 rounded-lg border border-slate-200 text-[10px] font-bold">
                              <button
                                type="button"
                                onClick={() => setMed(m.id, { m: !m.m })}
                                className={`px-2 py-0.5 rounded transition ${m.m ? "bg-teal-600 text-white" : "text-slate-400"}`}
                              >M</button>
                              <button
                                type="button"
                                onClick={() => setMed(m.id, { a: !m.a })}
                                className={`px-2 py-0.5 rounded transition ${m.a ? "bg-teal-600 text-white" : "text-slate-400"}`}
                              >A</button>
                              <button
                                type="button"
                                onClick={() => setMed(m.id, { n: !m.n })}
                                className={`px-2 py-0.5 rounded transition ${m.n ? "bg-teal-600 text-white" : "text-slate-400"}`}
                              >N</button>
                            </div>

                            <span className="font-mono font-bold text-teal-800 text-[11px]">
                              ({doseStr(m, " - ")})
                            </span>

                            <select
                              value={m.timing}
                              onChange={(e) => setMed(m.id, { timing: e.target.value })}
                              className="text-[10px] font-medium border border-slate-200 rounded-lg px-2 py-1 bg-white focus:outline-none"
                            >
                              {TIMINGS.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>

                            <div className="flex items-center gap-1 text-[10px]">
                              <span>For:</span>
                              <input
                                type="number"
                                min="1"
                                max="30"
                                value={m.days}
                                onChange={(e) => setMed(m.id, { days: Number(e.target.value) })}
                                className="w-10 border border-slate-200 rounded-lg px-1 py-1 text-center font-bold bg-white"
                              />
                              <span>days</span>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* Voice Memo Box */}
                <div className="border-t pt-3 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <p className="text-xs font-bold text-slate-800">Doctor Voice Audio Memo</p>
                    <p className="text-[10px] text-slate-500">Record a quick audio message directly for the front desk.</p>
                  </div>
                  {!rec ? (
                    <button type="button" onClick={startRec} className="min-h-[40px] px-4 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-sm">
                      🎙 Record Memo
                    </button>
                  ) : (
                    <button type="button" onClick={stopRec} className="min-h-[40px] px-4 bg-slate-900 text-white rounded-lg text-xs font-bold animate-pulse transition">
                      ■ Stop & Attach
                    </button>
                  )}
                </div>
                {audio && <audio controls src={audio} className="w-full h-10 mt-1"></audio>}

              </div>

              {/* Tamil Booklet Summary */}
              <div className="bg-amber-50 p-4 rounded-xl border border-amber-200">
                <h4 className="text-xs font-bold text-amber-900 mb-1 ta">பல் சிகிச்சைக்குப் பின் கவனிக்க வேண்டியவை (Booklet Summary)</h4>
                <p className="text-xs text-amber-900 whitespace-pre-line leading-relaxed ta">{tamilFor(op.department)}</p>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-700">Operatory Notes (Optional)</label>
                <input value={op.notes} onChange={e => setOp({ ...op, notes: e.target.value })} className="w-full mt-1 p-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-teal-500 focus:outline-none" placeholder="e.g. Canals prepared to 21mm, temporized with Cavit" />
              </div>

              <div className="flex flex-col sm:flex-row gap-3 pt-2">
                <button className="flex-1 min-h-[48px] bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-sm font-bold shadow transition">
                  Complete & Send to Reception
                </button>
                <button type="button" onClick={() => chairPt && wa(chairPt.phone, aftercareMsg(chairPt.name, op.procedure, op.teeth.join(", ") || "General", op.department))} className="min-h-[48px] px-5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold shadow transition">
                  Send Aftercare on WhatsApp
                </button>
              </div>
            </form>
          )}

          {/* TAB 5: REMINDERS */}
          {tab === 5 && (
            <div className="space-y-3">
              {reminders.map(r => (
                <div key={r.id} className={`p-4 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-4 ${r.status === "Pending" ? "bg-white border-amber-200 shadow-sm" : "bg-slate-50 border-slate-200"}`}>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-sm text-slate-900">{r.patientName}</span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${r.status === "Pending" ? "bg-amber-100 text-amber-800" : "bg-emerald-100 text-emerald-800"}`}>{r.status}</span>
                    </div>
                    <p className="text-xs font-medium text-teal-700">{r.type}</p>
                    <p className="text-xs text-slate-600 mt-1 max-w-xl">"{r.message}"</p>
                    <p className="text-[11px] text-slate-400 mt-1">{r.timing} · 📞 {r.phone}</p>
                  </div>
                  <div className="flex gap-2 shrink-0">
                    <button onClick={() => sms(r.phone, r.message, r.id)} className="px-3 py-2 bg-slate-800 text-white rounded-lg text-xs font-semibold">SMS</button>
                    <button onClick={() => wa(r.phone, r.message)} className="px-3 py-2 bg-emerald-600 text-white rounded-lg text-xs font-semibold">WhatsApp</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* TAB 6: GOOGLE REVIEWS */}
          {tab === 6 && (
            <div className="max-w-2xl mx-auto bg-white p-6 rounded-xl border border-slate-200 space-y-4 shadow-sm">
              <h3 className="text-base font-bold">⭐ Google Maps Review Requests</h3>
              <p className="font-mono text-[11px] bg-amber-50 p-2 rounded border border-amber-200 select-all overflow-x-auto text-amber-900">{MAPS}</p>
              <div className="divide-y divide-slate-100">
                {patients.map(p => {
                  const t = `Hello ${p.name}, thank you for choosing Dr. Rabia's Dental Care in Tindivanam. If you had a comfortable visit, please share a quick review on Google: ${MAPS}`;
                  return (
                    <div key={p.id} className="py-3 flex items-center justify-between text-xs">
                      <div>
                        <p className="font-bold">{p.name}</p>
                        <p className="text-slate-500">📞 {p.phone}</p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => sms(p.phone, t)} className="px-3 py-2 bg-slate-800 text-white rounded-lg font-semibold">SMS</button>
                        <button onClick={() => wa(p.phone, t)} className="px-3 py-2 bg-emerald-600 text-white rounded-lg font-semibold">WhatsApp</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

        </main>

        <footer className="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-400">
          Powered by <strong className="text-slate-700">Nexus Digital Hub</strong> ({PHONE})
        </footer>
      </div>

      {/* PRINT PREVIEW MODAL */}
      {printModalPt && (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
          <div className="bg-white rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col my-auto border border-slate-200">
            <div className="bg-slate-900 text-white px-5 py-3.5 flex justify-between items-center">
              <div className="flex items-center gap-2">
                <span className="text-lg">🖨️</span>
                <span className="text-sm font-bold">Official Prescription Slip Preview</span>
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => window.print()}
                  className="px-4 py-2 bg-teal-500 hover:bg-teal-600 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow"
                >
                  Send to Printer / Save PDF
                </button>
                <button
                  type="button"
                  onClick={() => setPrintModalPt(null)}
                  className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold transition"
                >
                  ✕ Close
                </button>
              </div>
            </div>

            <div className="p-6 overflow-y-auto max-h-[75vh] bg-slate-100">
              <div className="bg-white p-6 rounded-xl shadow border border-slate-200 text-xs">
                <div className="border-b-2 border-teal-700 pb-3 mb-3 flex justify-between items-start">
                  <div>
                    <h2 className="text-lg font-bold text-teal-800 m-0">Dr. Rabia's Dental Care</h2>
                    <p className="text-[11px] text-slate-600 mt-0.5">Multi-Speciality Dental Clinic & Implant Centre · Tindivanam</p>
                    <p className="text-[10px] text-slate-500 mt-0.5">Ph: {PHONE}</p>
                  </div>
                  <div className="text-right text-[10px]">
                    <p className="text-xs font-bold m-0">Date: {lvModal?.date || "Today"}</p>
                    <p className="font-mono text-slate-600 mt-0.5">Chart No: {modalPt?.chartNo}</p>
                    <p className="font-bold text-teal-800 mt-0.5">{lvModal?.department || "Dental Surgery"}</p>
                  </div>
                </div>

                <div className="bg-slate-50 p-2.5 rounded-lg mb-3 flex justify-between border border-slate-200 text-[11px]">
                  <div><strong>Patient:</strong> {modalPt?.name} ({modalPt?.age ? `${modalPt.age}y` : "Adult"} / {modalPt?.gender || "Female"})</div>
                  <div><strong>Phone:</strong> {modalPt?.phone}</div>
                  <div><strong>Tooth:</strong> #{lvModal?.tooth || "N/A"}</div>
                </div>

                {lvModal && <p className="mb-2 text-[11px]"><strong>Procedure:</strong> {lvModal.procedure}</p>}

                <div className="text-[11px] font-bold text-slate-700 border-b pb-1 mb-2">
                  ℞ Therapeutic Composition / Active Salt Formulation
                </div>
                <div className="border border-slate-200 rounded-lg p-2.5 mb-3 bg-white space-y-2">
                  {(lvModal?.medicines || []).map((m, i) => (
                    <div key={i} className="pb-1.5 border-b border-dashed border-slate-200 last:border-b-0 text-[11px]">
                      <div className="flex justify-between items-start gap-2">
                        <span className="font-bold text-slate-900">
                          {i + 1}. {composition(m)}{isCombo(m) ? " — Fixed-Dose Combination" : ""}
                        </span>
                        <span className="font-mono font-bold text-teal-800 bg-teal-50 px-2 py-0.5 rounded border border-teal-200 whitespace-nowrap">
                          [ {doseStr(m, " — ")} ]
                        </span>
                      </div>
                      <div className="text-[10px] text-slate-500 mt-0.5">
                        {m.timing} · {m.days} day{m.days > 1 ? "s" : ""} course
                      </div>
                    </div>
                  ))}
                </div>

                <div className="border border-amber-300 p-3 rounded-lg bg-amber-50 mb-4 text-[10.5px]">
                  <p className="font-bold text-amber-900 mb-1">பல் சிகிச்சைக்குப் பின் கவனிக்க வேண்டியவை (Post-Treatment Care)</p>
                  <p className="text-slate-800 whitespace-pre-line leading-relaxed">{tamilFor(lvModal?.department)}</p>
                </div>

                <div className="flex justify-between items-end pt-2 border-t border-dashed border-slate-300 text-[10px]">
                  <div>
                    <p className="font-bold text-slate-800">Clinical record verified</p>
                    <p className="text-slate-500">Medicines are dispensed at the Clinic Pharmacy Counter</p>
                  </div>
                  <div className="text-center">
                    <p className="font-bold text-slate-900">Dr. Rabia, B.D.S.</p>
                    <p className="text-[9px] text-slate-500">Dental Surgeon · Reg. No: State Dental Council</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* RECEPTION PRINTABLE A4 SLIP */}
      <div id="reception-rx-sheet" style={{ fontFamily: "'Plus Jakarta Sans','Noto Sans Tamil',sans-serif", padding: 8 }}>
        <div style={{ borderBottom: "2px solid #0f766e", paddingBottom: 10, marginBottom: 14, display: "flex", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 700, color: "#0f766e" }}>Dr. Rabia's Dental Care</div>
            <div style={{ fontSize: 11, color: "#475569" }}>Multi-Speciality Dental Clinic & Implant Centre · Tindivanam</div>
            <div style={{ fontSize: 10, color: "#64748b" }}>Ph: {PHONE}</div>
          </div>
          <div style={{ textAlign: "right", fontSize: 10 }}>
            <div style={{ fontSize: 11, fontWeight: 700 }}>Date: {lvModal?.date || "Today"}</div>
            <div style={{ fontFamily: "monospace" }}>Chart No: {modalPt?.chartNo}</div>
            <div style={{ fontWeight: 700, color: "#0f766e" }}>{lvModal?.department || "Dental Surgery"}</div>
          </div>
        </div>

        <div style={{ background: "#f8fafc", padding: 10, borderRadius: 6, marginBottom: 14, fontSize: 11, display: "flex", justifyContent: "space-between", border: "1px solid #e2e8f0" }}>
          <div><strong>Patient:</strong> {modalPt?.name} ({modalPt?.age ? `${modalPt.age}y` : "Adult"} / {modalPt?.gender || "Female"})</div>
          <div><strong>Phone:</strong> {modalPt?.phone}</div>
          <div><strong>Tooth:</strong> #{lvModal?.tooth || "N/A"}</div>
        </div>

        {lvModal && <div style={{ fontSize: 11, marginBottom: 10 }}><strong>Procedure:</strong> {lvModal.procedure}</div>}

        <div style={{ fontSize: 12, fontWeight: 700, color: "#334155", borderBottom: "1px solid #e2e8f0", paddingBottom: 4, marginBottom: 8 }}>
          ℞ Therapeutic Composition / Salt Formulation
        </div>

        <div style={{ border: "1px solid #e2e8f0", borderRadius: 6, padding: "6px 12px", marginBottom: 14 }}>
          {(lvModal?.medicines || []).map((m, i, arr) => (
            <div key={i} style={{ padding: "7px 0", borderBottom: i === arr.length - 1 ? "none" : "1px dashed #cbd5e1", fontSize: 11 }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                <span style={{ fontWeight: 700, color: "#0f172a" }}>{i + 1}. {composition(m)}{isCombo(m) ? " — Fixed-Dose Combination" : ""}</span>
                <span style={{ fontFamily: "monospace", fontWeight: 700, color: "#0f766e", background: "#f0fdfa", padding: "2px 6px", borderRadius: 4, border: "1px solid #ccfbf1", whiteSpace: "nowrap" }}>[ {doseStr(m, " — ")} ]</span>
              </div>
              <div style={{ fontSize: 10, color: "#64748b", marginTop: 2 }}>{m.timing} · {m.days} day{m.days > 1 ? "s" : ""} course</div>
            </div>
          ))}
        </div>

        <div style={{ border: "1px solid #cbd5e1", padding: 10, borderRadius: 6, background: "#fefce8", marginBottom: 18 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#854d0e", marginBottom: 5 }}>பல் சிகிச்சைக்குப் பின் கவனிக்க வேண்டியவை (Post-Treatment Care)</div>
          <div style={{ fontSize: 10.5, whiteSpace: "pre-line", lineHeight: 1.6, color: "#1e293b" }}>{tamilFor(lvModal?.department)}</div>
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", paddingTop: 10, borderTop: "1px dashed #cbd5e1" }}>
          <div>
            <div style={{ fontSize: 11, fontWeight: 700 }}>Clinical record verified</div>
            <div style={{ fontSize: 9, color: "#64748b" }}>Medicines are dispensed at the Clinic Pharmacy Counter</div>
          </div>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 10, fontWeight: 700 }}>Dr. Rabia, B.D.S.</div>
            <div style={{ fontSize: 8, color: "#64748b" }}>Dental Surgeon · Reg. No: State Dental Council</div>
          </div>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
