.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(15,28,46,.04)}
.card-h{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}

.sub{font-size:12px;color:var(--mute)}
.well{background:#f7f9fc;border:1px solid var(--line);border-radius:8px}
.divide>*+*{border-top:1px solid var(--line)}
.rowh:hover{background:#f7f9fc}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 13px;border-radius:7px;font-size:12.5px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;line-height:1}
.btn:active{transform:translateY(1px)}
.btn-lg{min-height:46px;font-size:13.5px;padding:0 20px}
.btn-p{background:var(--acc);color:#fff}.btn-p:hover{background:var(--acc2)}
.btn-d{background:var(--nav);color:#fff}.btn-d:hover{background:#13304f}
.btn-o{background:#fff;color:var(--ink);border-color:#cdd6e2}.btn-o:hover{border-color:var(--acc);color:var(--acc)}

.btn-r{background:#fff;color:var(--danger);border-color:var(--dangerln)}.btn-r:hover{background:var(--dangerbg)}
.btn-rec{background:var(--danger);color:#fff}.btn-rec:hover{background:#951c13}

.btn-link:hover{text-decoration:underline}

// --- IndexedDB for Audio Storage (Bypasses 5MB LocalStorage Limit) ---
const DB_NAME = "RabiaClinicDB_v1";
const STORE_NAME = "audioMemos";

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveAudioToDB(id, blob) {
  try {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put(blob, id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) {
    console.error("IndexedDB save error", e);
  }
}

async function getAudioFromDB(id) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(id);
      req.onsuccess = () => {
        if (req.result) {
          resolve(URL.createObjectURL(req.result));
        } else {
          resolve(null);
        }
      };
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    return null;
  }
}

const parseDrug = (s) => {
  const parts = s.split("|");
  const brandName = parts[0];
  const genericSalt = parts[1] || "";
  const d = parts[2] || "101";
  const timing = parts[3] || "After Food";
  const days = Number(parts[4]) || 3;
  return { brandName, genericSalt, m: d[0] === "1", a: d[1] === "1", n: d[2] === "1", timing, days };
};

    e.preventDefault();
    const c = {
      id: "p_" + Date.now(),
      name: newPt.name,
      phone: newPt.phone,
      age: Number(newPt.age) || "",
      gender: newPt.gender,
      chartNo: newPt.chartNo || "20261007_" + Math.floor(100000 + Math.random() * 900000),
      medicalHistory: "None reported",
      allergies: newPt.allergies.split(",").map(s => s.trim()).filter(Boolean),
      conditions: [],
      complaint: newPt.complaint || "Routine evaluation",
      status: "Waiting in Lobby",
      dentalChart: {},
      visits: []
    };
    setPatients([c, ...patients]);
    setSel(c);
    setNewPt(blankPt);
    say("Patient record created");
  };

  const addAppt = (e) => {
    e.preventDefault();
    setAppts([{ id: "apt-" + Date.now(), ...newApt, status: "Confirmed" }, ...appts]);
    setNewApt(blankApt);
    say("Appointment confirmed");
  };

  const admit = (a) => {
    const c = {
      id: "p_" + Date.now(),
      name: a.name,
      phone: a.phone,
      age: Number(a.age) || 25,
      gender: a.gender || "Female",
      chartNo: "20261007_" + Math.floor(100000 + Math.random() * 900000),
      medicalHistory: "None reported",
      allergies: [],
      conditions: [],
      complaint: a.complaint || "Scheduled consultation",
      status: "Waiting in Lobby",
      dentalChart: {},
      visits: []
    };
    setPatients([c, ...patients]);
    setAppts(appts.map(x => x.id === a.id ? { ...x, status: "Arrived / In Clinic" } : x));
    setSel(c);
    setTab(3);
  };

  const wa = (phone, text) => {
    const p = phone.replace(/\D/g, "");
    window.open(`https://wa.me/${p.length === 10 ? "91" + p : p}?text=${encodeURIComponent(text)}`, "_blank");
  };
  const sms = (phone, text, id) => {
    if (id) setReminders(reminders.map(r => r.id === id ? { ...r, status: "Sent", timing: "Sent just now" } : r));
    window.location.href = `sms:${phone}?body=${encodeURIComponent(text)}`;
  };
  const aftercareMsg = (name, procedure, tooth, dept) =>
    `*Dr. Rabia's Dental Care, Tindivanam*\n\nHello ${name},\nஉங்கள் சிகிச்சைக்குப் பின் கவனிக்க வேண்டியவை — ${procedure} (Tooth #${tooth}):\n\n${tamilFor(dept)}\n\nஅவசர உதவி / Emergency: ${PHONE}`;

  const term = dq.trim().toLowerCase();
  const results = term.length < 2 ? [] : allDrugs.filter(d => (d.brandName + " " + d.genericSalt).toLowerCase().includes(term))
    .sort((x, y) => (y.brandName.toLowerCase().startsWith(term) ? 1 : 0) - (x.brandName.toLowerCase().startsWith(term) ? 1 : 0)).slice(0, 24);
  const groupsView = custom.length ? { ...DRUG_GROUPS, [CUSTOM_GROUP]: [] } : DRUG_GROUPS;
  const drugBtn = (d, big) => (
    <button type="button" key={d.brandName} onClick={() => tapDrug(d)} className={`chip text-left ${inRx(d.brandName) ? "on" : ""}`} style={{ minHeight: 40 }}>
      <span className="inline-flex items-center gap-1.5">
        <Icon n={inRx(d.brandName) ? "check" : "plus"} s={12} w={2.2} />{d.brandName}
      </span>
      {big && <span className="block text-[10.5px] font-normal opacity-80 mt-0.5" style={{ whiteSpace: "normal", lineHeight: 1.3 }}>{d.genericSalt}</span>}
    </button>
  );

  const fp = patients.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || p.phone.includes(q) || (p.chartNo || "").includes(q));
  const chairPt = patients.find(p => p.id === op.patientId) || patients[0];
  const modalPt = printModalPt || patients[0];
  const lvModal = modalPt?.visits?.[0];

  const alerts = (p) => p && (p.allergies?.length > 0 || p.conditions?.length > 0) && (
    <div className="rounded-lg p-3" style={{ background: "var(--dangerbg)", border: "1px solid var(--dangerln)", borderLeft: "4px solid var(--danger)" }}>
      <p className="text-xs font-semibold flex items-center gap-1.5" style={{ color: "var(--danger)" }}><Icon n="alert" s={14} /> Clinical risk alert — {p.name}</p>
      <div className="flex flex-wrap gap-1.5 mt-1.5">
        {p.allergies?.map(a => <span key={a} className="badge b-d">Allergy: {a}</span>)}
        {p.conditions?.map(c => <span key={c} className="badge b-w">{c}</span>)}
      </div>
    </div>
  );

  const rxList = (v) => (v && v.medicines) ? v.medicines.map((m, i) => (
    <p key={i} className="text-[11px] text-slate-700 leading-relaxed">• {m.brandName} [ {doseStr(m, " - ")} ] {m.timing} × {m.days}d</p>
  )) : null;

  const TABS = [
    [1, "Overview", "overview"],
    [2, "Appointments", "calendar", appts.filter(a => a.status === "Confirmed").length],
    [3, "Patients & EHR", "users", patients.filter(p => p.status === "Ready for Rx Print").length],
    [4, "Doctor Operatory (Logs)", "pulse"],
    [5, "Reminders", "bell", reminders.filter(r => r.status === "Pending").length],
    [6, "Google Reviews", "star"]
  ];

  if (!user) return (
    <div 
  className="min-h-screen flex items-center justify-center p-4 bg-cover bg-center bg-no-repeat relative"
  style={{ 
    backgroundImage: "linear-gradient(rgba(12, 32, 54, 0.75), rgba(9, 24, 42, 0.85)), url('https://lh3.googleusercontent.com/d/1PixHjLyUX_civhYK4POOo0rf05fDMUKH')" 
  }}
>
      <form onSubmit={doLogin} className="w-full max-w-md bg-white rounded-xl p-8 space-y-4" style={{ boxShadow: "0 24px 60px rgba(0,0,0,.4)" }}>
        <div className="flex items-center gap-3 pb-2">
          <div className="w-11 h-11 rounded-lg flex items-center justify-center text-white" style={{ background: "var(--acc)" }}><Icon n="shield" s={22} w={1.6} /></div>
          <div>
            <h1 className="text-lg font-bold leading-tight">Dr. Rabia's Dental Care</h1>
            <p className="text-xs text-slate-500 flex items-center gap-1 mt-0.5"><Icon n="lock" s={12} /> Authorized staff only · confidential patient data</p>
          </div>
        </div>
        {loginError && <div className="p-3 text-xs rounded-lg flex items-center gap-2" style={{ background: "var(--dangerbg)", border: "1px solid var(--dangerln)", color: "var(--danger)" }}><Icon n="alert" s={14} />{loginError}</div>}
        <Field label="Staff User ID" required value={login.username} onChange={e => setLogin({ ...login, username: e.target.value })} />
        <Field label="Password" type="password" required value={login.password} onChange={e => setLogin({ ...login, password: e.target.value })} />
        <button className="btn btn-p btn-lg w-full">Unlock clinic portal</button>
        <p className="text-[11px] text-slate-400 text-center pt-1">Powered by <strong>Nexus Digital Hub</strong> ({PHONE})</p>
      </form>
    </div>
  );

  const pageTitle = (TABS.find(t => t[0] === tab) || TABS[0])[1];
  const NavInner = ({ t }) => (<><Icon n={t[2]} s={17} />{t[1]}{t[3] > 0 && <span className="navcount">{t[3]}</span>}</>);

  return (
    <div>
      <div className="app-chrome">
        {/* Sidebar (desktop) */}
        <aside className="sidebar">
          <div className="px-5 pt-6 pb-5 flex items-center gap-3 border-b" style={{ borderColor: "rgba(255,255,255,.08)" }}>
            <div className="w-10 h-10 rounded-lg flex items-center justify-center text-white" style={{ background: "var(--acc)" }}><Icon n="shield" s={21} w={1.6} /></div>
            <div>
              <p className="text-white font-semibold text-[14px] leading-tight">Dr. Rabia's Dental Care</p>
              <p className="text-[11px] mt-0.5" style={{ color: "#8da3bd" }}>Tindivanam Clinic Portal & EzDent Bridge</p>
            </div>
          </div>
          <nav className="flex-1 p-3 space-y-1 overflow-y-auto">
            {TABS.map(t => (
              <button key={t[0]} onClick={() => setTab(t[0])} className={`navbtn ${tab === t[0] ? "on" : ""}`}><NavInner t={t} /></button>
            ))}
          </nav>
          <div className="p-4 border-t" style={{ borderColor: "rgba(255,255,255,.08)" }}>
            <p className="text-white text-[13px] font-semibold">{user.name}</p>
            <p className="text-[11.5px] mb-3" style={{ color: "#5fd3c6" }}>{user.role}</p>
            <button onClick={logout} className="btn w-full" style={{ background: "rgba(255,255,255,.08)", color: "#e3ecf6", borderColor: "rgba(255,255,255,.12)" }}><Icon n="logout" s={14} /> Sign out</button>
          </div>
        </aside>

        <div className="main">
          <header className="topbar">
            <div className="px-4 sm:px-8 h-14 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="mnav w-8 h-8 rounded-md items-center justify-center text-white" style={{ background: "var(--acc)" }}><Icon n="shield" s={17} w={1.6} /></div>
                <h2 className="text-[15px] font-semibold">{pageTitle}</h2>
              </div>
              <div className="flex items-center gap-3">
                <div className="text-right hidden sm:block">
                  <p className="text-xs font-semibold leading-tight">{user.name}</p>
                  <p className="text-[11px]" style={{ color: "var(--acc)" }}>{user.role}</p>
                </div>
                <button onClick={logout} className="btn btn-o lg:hidden"><Icon n="logout" s={14} /> Sign out</button>
              </div>
            </div>
            <div className="mnav px-2 overflow-x-auto no-scrollbar border-t" style={{ borderColor: "var(--line)" }}>
              {TABS.map(t => (
                <button key={t[0]} onClick={() => setTab(t[0])} className={`mtab ${tab === t[0] ? "on" : ""}`}>
                  <Icon n={t[2]} s={15} />{t[1]}{t[3] > 0 && <span className="badge b-w">{t[3]}</span>}
                </button>
              ))}
            </div>
          </header>

          {toast && <div className="toast"><Icon n="check" s={16} w={2.2} style={{ color: "#5fd3c6" }} />{toast.msg}</div>}

          <main className="w-full p-4 sm:p-8 flex-1" style={{ maxWidth: 1240 }}>
            {tab === 1 && (
              <div className="space-y-6">
                <div className="grid grid-cols-2 xl:grid-cols-4 gap-4">
                  {[
                    ["Total patients", patients.length, "users"],
                    ["Appointments", appts.length, "calendar"],
                    ["Ready to print", patients.filter(p => p.status === "Ready for Rx Print").length, "printer"],
                    ["Google rating", <span className="inline-flex items-center gap-1.5">4.9 <Icon n="star" s={18} style={{ color: "#d99a1c", fill: "#f2b53a" }} /></span>, "star"]
                  ].map(([l, v, ic]) => (
                    <div key={l} className="card p-4 flex items-start justify-between">
                      <div>
                        <p className="text-xs font-medium text-slate-500">{l}</p>
                        <p className="text-[26px] font-bold mt-1 leading-none">{v}</p>
                      </div>
                      <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: "var(--accbg)", color: "var(--acc)" }}><Icon n={ic} s={18} /></div>
                    </div>
                  ))}
                </div>
                <div className="card">
                  <div className="card-h">
                    <h3 className="card-t">Recent Treatments</h3>
                    <button onClick={() => setTab(4)} className="btn-link">Open operatory <Icon n="arrow" s={13} /></button>
                  </div>
                  <div className="divide">
                    {patients.flatMap(p => (p.visits || []).map(v => ({ v, p }))).slice(0, 4).map(({ v, p }, i) => (
                      <div key={i} className="px-5 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-sm">
                        <div>
                          <p className="font-semibold">{p.name} — <span style={{ color: "var(--acc)" }}>{v.procedure}</span></p>
                          <p className="text-xs text-slate-500 mt-0.5">Tooth #{v.tooth} · Chart {p.chartNo}</p>
                          <div className="mt-1.5">{rxList(v)}</div>
                        </div>
                        <div className="flex gap-2 shrink-0">
                          <button onClick={() => setPrintModalPt(p)} className="btn btn-d"><Icon n="eye" s={14} /> Preview & Print Rx</button>
                          <button onClick={() => wa(p.phone, aftercareMsg(p.name, v.procedure, v.tooth, v.department))} className="btn btn-wa"><Icon n="message" s={14} /> WhatsApp</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {tab === 2 && (
              <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                <div className="xl:col-span-2 card divide overflow-hidden self-start">
                  {appts.map(a => (
                    <div key={a.id} className="px-5 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className="font-semibold text-sm">{a.name}</span>
                          <span className="badge b-n">{a.gender || "Female"}, {a.age ? `${a.age}y` : "Adult"}</span>
                          <span className="badge b-a">{a.time}</span>
                          <span className="badge b-n">{a.date}</span>
                        </div>
                        <p className="text-xs text-slate-500 mt-1.5 flex items-center gap-1.5"><Icon n="phone" s={12} /> {a.phone} · {a.doctor}</p>
                        <p className="text-xs text-slate-600 mt-0.5">Complaint: {a.complaint || "General checkup"}</p>
                      </div>
                      <div className="flex items-center gap-2 shrink-0">
                        {a.status !== "Arrived / In Clinic" ? (
                          <button onClick={() => admit(a)} className="btn btn-p">Admit to queue</button>
                        ) : (
                          <span className="badge b-o" style={{ padding: "6px 11px" }}><Icon n="check" s={13} w={2.2} /> Admitted</span>
                        )}
                        <button onClick={() => wa(a.phone, `Hello ${a.name}, your dental appointment with ${a.doctor} at Dr. Rabia's Dental Care Tindivanam is on ${a.date} at ${a.time}. Please arrive 10 minutes early. Location: ${MAPS}`)} className="btn btn-wa"><Icon n="send" s={13} /> Notify</button>
                      </div>
                    </div>
                  ))}
                </div>
                <form onSubmit={addAppt} className="card self-start">
                  <div className="card-h"><h3 className="card-t">Book New Appointment</h3></div>
                  <div className="card-b space-y-3.5">
                    <Field label="Patient name" required value={newApt.name} onChange={e => setNewApt({ ...newApt, name: e.target.value })} />
                    <div className="grid grid-cols-2 gap-3">
                      <Field label="Phone (10 digits)" type="tel" required value={newApt.phone} onChange={e => setNewApt({ ...newApt, phone: e.target.value })} />
                      <Field label="Age" type="number" required value={newApt.age} onChange={e => setNewApt({ ...newApt, age: e.target.value })} placeholder="e.g. 28" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <Field label="Date" type="date" required value={newApt.date} onChange={e => setNewApt({ ...newApt, date: e.target.value })} />
                      <Field label="Time" type="time" required value={newApt.time} onChange={e => setNewApt({ ...newApt, time: e.target.value })} />
                    </div>
                    <Field label="Chief concern" value={newApt.complaint} onChange={e => setNewApt({ ...newApt, complaint: e.target.value })} />
                    <button className="btn btn-p btn-lg w-full">Confirm booking</button>
                  </div>
                </form>
              </div>
            )}

            {tab === 3 && (
              <div className="space-y-5">
                {patients.some(p => p.status === "Ready for Rx Print") && (
                  <div className="rounded-lg p-4 space-y-2.5" style={{ background: "var(--warnbg)", border: "1px solid var(--warnln)" }}>
                    <p className="text-xs font-semibold flex items-center gap-2" style={{ color: "var(--warn)" }}>
                      <Icon n="printer" s={15} /> Completed by Doctor — Ready for Printing (1-Click):
                    </p>
                    <div className="flex flex-wrap gap-2">
                      {patients.filter(p => p.status === "Ready for Rx Print").map(p => (
                        <button key={p.id} onClick={() => setPrintModalPt(p)} className="btn btn-d">
                          <span>Preview & Print: {p.name} (#{p.visits && p.visits[0] ? p.visits[0].tooth : "Rx"})</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                  <div className="xl:col-span-2 space-y-4">
                    <div className="relative">
                      <Icon n="search" s={16} className="absolute" style={{ left: 13, top: 13, color: "var(--mute)" }} />
                      <input placeholder="Search name, phone or EzDent chart no…" value={q} onChange={e => setQ(e.target.value)} className="inp" style={{ marginTop: 0, paddingLeft: 38, height: 42 }} />
                    </div>
                    <div className="card divide overflow-hidden">
                      {fp.map(pt => (
                        <div key={pt.id} onClick={() => setSel(pt)} className="rowh px-5 py-4 cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3" style={sel?.id === pt.id ? { background: "var(--accbg)", boxShadow: "inset 3px 0 0 var(--acc)" } : {}}>
                          <div>
                            <div className="flex items-center gap-2 flex-wrap">
                              <span className="font-semibold">{pt.name}</span>
                              <span className="badge b-n">{pt.gender}, {pt.age ? `${pt.age}y` : "Adult"}</span>
                              <span className="badge b-a">{pt.chartNo}</span>
                              {pt.status === "Ready for Rx Print" && <span className="badge b-w"><i className="dot"></i> Ready to print Rx</span>}
                            </div>
                            <p className="text-xs text-slate-500 mt-1.5 flex items-center gap-1.5"><Icon n="phone" s={12} /> {pt.phone} · {pt.medicalHistory}</p>
                            <div className="flex flex-wrap gap-1.5 mt-1.5">
                              {pt.allergies?.map(a => <span key={a} className="badge b-d"><Icon n="alert" s={11} /> {a}</span>)}
                              {pt.conditions?.map(c => <span key={c} className="badge b-w">{c}</span>)}
                            </div>
                          </div>
                          {pt.visits && pt.visits.length > 0 && (
                            <button onClick={(e) => { e.stopPropagation(); setPrintModalPt(pt); }} className="btn btn-d shrink-0"><Icon n="eye" s={14} /> Preview & Print</button>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="self-start">
                    {sel ? (
                      <div className="card">
                        <div className="card-h">
                          <h3 className="card-t">EHR Patient Chart</h3>
                          <button onClick={() => setSel(null)} className="btn-link" style={{ color: "var(--ink2)" }}>Close <Icon n="x" s={13} /></button>
                        </div>
                        <div className="card-b space-y-4">
                          {alerts(sel)}
                          <div>
                            <p className="text-lg font-bold">{sel.name}</p>
                            <p className="text-xs text-slate-500 mt-0.5">{sel.phone} · {sel.age ? `${sel.age}y` : "Adult"} · {sel.gender}</p>
                            <p className="text-xs font-semibold mt-0.5" style={{ color: "var(--acc2)" }}>Chart: {sel.chartNo}</p>
                            <p className="text-xs mt-2">Complaint: <strong>{sel.complaint}</strong></p>
                          </div>
                          <Odontogram selected={[]} onToggle={() => {}} chart={sel.dentalChart} />
                          <div className="space-y-3 max-h-72 overflow-y-auto">
                            {(!sel.visits || sel.visits.length === 0) ? (
                              <p className="text-xs text-slate-400 italic">No visits recorded.</p>
                            ) : sel.visits.map((v, i) => (
                              <div key={i} className="text-xs well p-3 space-y-1.5">
                                <div className="flex justify-between gap-2 font-semibold">
                                  <span>{v.procedure} (#{v.tooth})</span>
                                  <span className="text-slate-400 font-medium whitespace-nowrap">{v.date}</span>
                                </div>
                                <p className="text-slate-600">{v.notes}</p>
                                <div className="bg-white p-2.5 rounded-md border" style={{ borderColor: "var(--line)" }}>
                                  <p className="text-[11px] font-semibold text-slate-700 mb-1">Pharmacy pick-list (staff only):</p>
                                  {rxList(v)}
                                </div>
                                {v.voiceMemo && <VisitAudioPlayer audioId={v.voiceMemo} />}
                              </div>
                            ))}
                          </div>
                          <div className="flex gap-2">
                            {sel.visits && sel.visits.length > 0 && (
                              <button onClick={() => setPrintModalPt(sel)} className="btn btn-d flex-1" style={{ minHeight: 40 }}><Icon n="eye" s={14} /> Preview & Print</button>
                            )}
                            <button onClick={() => { setOp(p => ({ ...p, patientId: sel.id })); setTab(4); }} className="btn btn-p flex-1" style={{ minHeight: 40 }}>Log treatment</button>
                          </div>
                        </div>
                      </div>
                    ) : (
                      <form onSubmit={addPatient} className="card">
                        <div className="card-h"><h3 className="card-t">Register Walk-in Patient</h3></div>
                        <div className="card-b space-y-3.5">
                          <Field label="Full name" required value={newPt.name} onChange={e => setNewPt({ ...newPt, name: e.target.value })} />
                          <div className="grid grid-cols-2 gap-3">
                            <Field label="Phone" type="tel" required value={newPt.phone} onChange={e => setNewPt({ ...newPt, phone: e.target.value })} />
                            <Field label="Age" type="number" required value={newPt.age} onChange={e => setNewPt({ ...newPt, age: e.target.value })} placeholder="e.g. 23" />
                          </div>
                          <Field label="EzDent chart no" value={newPt.chartNo} onChange={e => setNewPt({ ...newPt, chartNo: e.target.value })} />
                          <Field label="Allergies (comma separated)" value={newPt.allergies} onChange={e => setNewPt({ ...newPt, allergies: e.target.value })} />
                          <Field label="Chief complaint" value={newPt.complaint} onChange={e => setNewPt({ ...newPt, complaint: e.target.value })} />
                          <button className="btn btn-p btn-lg w-full">Save patient record</button>
                        </div>
                      </form>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: DOCTOR OPERATORY */}
            {tab === 4 && (
              <form onSubmit={saveTreatment} className="max-w-4xl card">
                <div className="card-h" style={{ alignItems: "flex-start" }}>
                  <div>
                    <h3 className="card-t">Doctor Operatory — Chairside, Tap Only</h3>
                    <p className="sub mt-1">Commercial trade names show here for clinic pharmacy. The printed slip generates legal active formulations only.</p>
                  </div>
                </div>
                <div className="card-b space-y-6">
                  <div>
                    <label className="lbl">Patient in chair</label>
                    <select value={op.patientId} onChange={e => setOp({ ...op, patientId: e.target.value, teeth: [] })} className="inp font-semibold">
                      {patients.map(p => <option key={p.id} value={p.id}>{p.name} — {p.chartNo}</option>)}
                    </select>
                  </div>
                  {alerts(chairPt)}

                  <div>
                    <Odontogram selected={op.teeth} onToggle={toggleTooth} chart={chairPt?.dentalChart} />
                    <p className="text-xs font-semibold mt-2" style={{ color: "var(--acc2)" }}>Selected: {op.teeth.length ? "#" + op.teeth.join(", #") : "none yet"}</p>
                  </div>

                  {/* Specialty & Procedure Selectors */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 well p-4">
                    <div>
                      <div className="flex justify-between items-center">
                        <label className="lbl">Specialty Category</label>
                        <button type="button" onClick={handleAddNewCategory} className="btn-link"><Icon n="plus" s={12} w={2.2} /> Add category</button>
                      </div>
                      <select
                        value={op.department}
                        onChange={e => {
                          const dept = e.target.value;
                          setOp({ ...op, department: dept, procedure: (categories[dept] && categories[dept][0]) || "General Consultation" });
                        }}
                        className="inp font-semibold"
                      >
                        {Object.keys(categories).map(d => <option key={d} value={d}>{d}</option>)}
                      </select>
                    </div>
                    <div>
                      <div className="flex justify-between items-center">
                        <label className="lbl">Clinical Procedure</label>
                        <button type="button" onClick={handleAddNewProcedure} className="btn-link"><Icon n="plus" s={12} w={2.2} /> Add procedure</button>
                      </div>
                      <select
                        value={op.procedure}
                        onChange={e => setOp({ ...op, procedure: e.target.value })}
                        className="inp font-semibold"
                      >
                        {(categories[op.department] || []).map(pr => <option key={pr} value={pr}>{pr}</option>)}
                      </select>
                    </div>
                  </div>

                  {/* Drug Search & One-Tap Palette */}
                  <div className="well p-4 space-y-4">
                    <div className="flex justify-between items-center flex-wrap gap-1">
                      <p className="text-sm font-semibold">Drug Search & One-Tap Palette ({allDrugs.length} Formulations)</p>
                      <span className="text-xs font-medium" style={{ color: "var(--acc2)" }}>Tap adds formulation</span>
                    </div>
                    <div className="flex gap-2">
                      <div className="relative flex-1 min-w-0">
                        <Icon n="search" s={15} className="absolute" style={{ left: 11, top: 13, color: "var(--mute)" }} />
                        <input value={dq} onChange={e => setDq(e.target.value)} placeholder="Type 2 letters — au, pan, flag, syp…" className="inp" style={{ marginTop: 0, paddingLeft: 34, height: 40 }} />
                      </div>
                      {dq && <button type="button" onClick={() => setDq("")} className={chip(false)}>Clear</button>}
                      <button type="button" onClick={() => setShowAdd(true)} className="btn btn-d" style={{ minHeight: 40 }}><Icon n="plus" s={14} w={2.2} /> Add clinic drug</button>
                    </div>
                    {term.length >= 2 ? (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {results.length ? results.map(d => drugBtn(d, true)) : <p className="text-xs text-slate-500 col-span-full">No match. Tap "+ Add clinic drug" to save it to your stock.</p>}
                      </div>
                    ) : (
                      <>
                        <div>
                          <p className="text-xs font-semibold text-slate-600 mb-2">Daily Quick-Tap Formulations</p>
                          <div className="flex flex-wrap gap-2">
                            {PRESETS.map(b => allDrugs.find(d => d.brandName === b)).filter(Boolean).map(d => drugBtn(d))}
                          </div>
                        </div>
                        <details className="bg-white rounded-lg border p-3" style={{ borderColor: "var(--line)" }}>
                          <summary className="text-xs font-semibold cursor-pointer min-h-[28px] flex items-center">Browse all 75+ drugs by category</summary>
                          <div className="space-y-4 mt-3">
                            {Object.keys(groupsView).map(g => (
                              <div key={g}>
                                <p className="text-xs font-semibold text-slate-600 mb-2">{g}</p>
                                <div className="flex flex-wrap gap-2">
                                  {allDrugs.filter(d => d.group === g).map(d => drugBtn(d))}
                                </div>
                              </div>
                            ))}
                          </div>
                        </details>
                      </>
                    )}

                    {showAdd && (
                      <div className="overlay z-40">
                        <div className="bg-white rounded-xl p-6 w-full max-w-md space-y-4 max-h-[90vh] overflow-y-auto" style={{ boxShadow: "0 24px 60px rgba(0,0,0,.35)" }}>
                          <h4 className="font-semibold text-[15px]">Add Clinic Drug to Stock</h4>
                          <Field label="Brand name" value={cd.brandName} onChange={e => setCd({ ...cd, brandName: e.target.value })} />
                          <Field label="Generic composition (printed on slip)" value={cd.genericSalt} onChange={e => setCd({ ...cd, genericSalt: e.target.value })} placeholder="e.g. Tab. Paracetamol 500 mg" />
                          <div>
                            <p className="lbl mb-1.5">Default timing</p>
                            <div className="flex flex-wrap gap-2">
                              {TIMINGS.map(t => <button type="button" key={t} onClick={() => setCd({ ...cd, timing: t })} className={chip(cd.timing === t)}>{t}</button>)}
                            </div>
                          </div>
                          {custom.length > 0 && (
                            <div className="border-t pt-3" style={{ borderColor: "var(--line)" }}>
                              <p className="lbl mb-1.5">Your saved stock</p>
                              {custom.map(c => (
                                <div key={c.brandName} className="flex justify-between items-center text-xs py-1.5">
                                  <span className="font-medium">{c.brandName} <span className="text-slate-400 font-normal">— {c.genericSalt}</span></span>
                                  <button type="button" onClick={() => setCustom(custom.filter(x => x.brandName !== c.brandName))} className="p-1 rounded text-slate-400 hover:text-red-600" aria-label="Remove"><Icon n="x" s={14} /></button>
                                </div>
                              ))}
                            </div>
                          )}
                          <div className="flex gap-2 pt-1">
                            <button type="button" onClick={() => {
                              const b = cd.brandName.trim(), g = cd.genericSalt.trim();
                              if (!b || !g) return say("Brand and generic composition are both required");
                              setCustom([...custom, { brandName: b, genericSalt: g, m: true, a: false, n: true, timing: cd.timing, days: 3, group: CUSTOM_GROUP }]);
                              setCd({ brandName: "", genericSalt: "", timing: "After Food" }); setShowAdd(false); say(`${b} saved to clinic stock`);
                            }} className="btn btn-p btn-lg flex-1">Save to stock</button>
                            <button type="button" onClick={() => setShowAdd(false)} className="btn btn-o btn-lg">Close</button>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* Prescriptions Added Counter */}
                    <div className="border-t pt-4 space-y-3" style={{ borderColor: "var(--line)" }}>
                      <p className="text-sm font-semibold">Prescription ({meds.length})</p>
                      {meds.length === 0 && <p className="text-xs text-slate-400 text-center py-4 bg-white rounded-lg border border-dashed" style={{ borderColor: "#cdd6e2" }}>Nothing prescribed. Tap a drug above.</p>}
                      {meds.map(m => (
                        <div key={m.id} className="bg-white p-4 rounded-lg border space-y-3" style={{ borderColor: "var(--line)" }}>
                          <div className="flex justify-between items-start gap-2">
                            <div>
                              <p className="font-semibold text-sm">{m.brandName} <span className="font-bold" style={{ color: "var(--acc2)" }}>[ {doseStr(m, " - ")} ]</span></p>
                              <p className="text-[11px] text-slate-500 mt-0.5">Prints as: {composition(m)}</p>
                            </div>
                            <button type="button" onClick={() => dropMed(m.id)} className="p-2 rounded-md text-slate-400 hover:text-red-600 hover:bg-red-50" aria-label="Remove medicine"><Icon n="x" s={16} /></button>
                          </div>

                          <div className="flex flex-wrap gap-1.5 items-center well p-2">
                            <span className="text-[11px] text-slate-500 font-semibold mr-1">Quick:</span>
                            <button type="button" onClick={() => setMed(m.id, { m: true, a: false, n: true, timing: "After Food" })} className="chip" style={{ minHeight: 28, fontSize: 11 }}>1-0-1 (BD)</button>
                            <button type="button" onClick={() => setMed(m.id, { m: true, a: true, n: true, timing: "After Food" })} className="chip" style={{ minHeight: 28, fontSize: 11 }}>1-1-1 (TDS)</button>
                            <button type="button" onClick={() => setMed(m.id, { m: true, a: false, n: false, timing: "Before Food" })} className="chip" style={{ minHeight: 28, fontSize: 11 }}>1-0-0 (OD)</button>
                            <button type="button" onClick={() => setMed(m.id, { m: false, a: false, n: true, timing: "SOS (Only if Pain)", days: 2 })} className="chip" style={{ minHeight: 28, fontSize: 11, background: "var(--warnbg)", color: "var(--warn)", borderColor: "var(--warnln)" }}>SOS</button>
                          </div>

                          <div className="flex flex-wrap gap-1.5 items-center">
                            {[["m", "M"], ["a", "A"], ["n", "N"]].map(([k, l]) => <button type="button" key={k} onClick={() => setMed(m.id, { [k]: !m[k] })} className={chip(m[k]) + " w-11"}>{l}</button>)}
                            <span className="w-1"></span>
                            {TIMINGS.map(t => <button type="button" key={t} onClick={() => setMed(m.id, { timing: t })} className={chip(m.timing === t)}>{t}</button>)}
                          </div>
                          <div className="flex flex-wrap gap-1.5 items-center">
                            <button type="button" onClick={() => setMed(m.id, { days: Math.max(1, m.days - 1) })} className={chip(false) + " w-9"}>−</button>
                            <span className="w-16 text-center text-xs font-semibold">{m.days} day{m.days > 1 ? "s" : ""}</span>
                            <button type="button" onClick={() => setMed(m.id, { days: Math.min(30, m.days + 1) })} className={chip(false) + " w-9"}>+</button>
                            <span className="w-1"></span>
                            {[1, 2, 3, 5, 7, 10, 14].map(n => <button type="button" key={n} onClick={() => setMed(m.id, { days: n })} className={`chip ${m.days === n ? "on" : ""}`} style={{ minHeight: 30, width: 32, padding: 0, fontSize: 11.5 }}>{n}</button>)}
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Voice Audio Recording */}
                    <div className="border-t pt-4 flex flex-wrap items-center justify-between gap-3" style={{ borderColor: "var(--line)" }}>
                      <div>
                        <p className="text-sm font-semibold">Doctor Voice Audio Memo</p>
                        <p className="text-[11.5px] text-slate-500">Stored safely in local database for this exact sitting.</p>
                      </div>
                      {!rec ? (
                        <button type="button" onClick={startRec} className="btn btn-rec" style={{ minHeight: 40 }}><Icon n="mic" s={15} /> Record Memo</button>
                      ) : (
                        <button type="button" onClick={stopRec} className="btn btn-d" style={{ minHeight: 40 }}><Icon n="stop" s={13} style={{ fill: "#ff6b5e", color: "#ff6b5e" }} /> Stop & Save</button>
                      )}
                    </div>
                    {audioPreview && <audio controls src={audioPreview} className="w-full h-9 mt-1"></audio>}
                  </div>

                  {/* Tamil Booklet Instructions */}
                  <div className="rounded-lg p-4" style={{ background: "var(--warnbg)", border: "1px solid var(--warnln)" }}>
                    <h4 className="text-xs font-bold mb-1.5 ta" style={{ color: "var(--warn)" }}>பல் சிகிச்சைக்குப் பின் கவனிக்க வேண்டியவை (Booklet Summary)</h4>
                    <p className="text-xs whitespace-pre-line leading-relaxed ta" style={{ color: "#4a3410" }}>{tamilFor(op.department)}</p>
                  </div>

                  <div>
                    <label className="lbl">Operatory Notes (Optional)</label>
                    <input value={op.notes} onChange={e => setOp({ ...op, notes: e.target.value })} className="inp" placeholder="e.g. Canals prepared to 21mm, temporized with Cavit" />
                  </div>

                  <div className="flex flex-col sm:flex-row gap-3 pt-1">
                    <button className="btn btn-p btn-lg flex-1"><Icon n="check" s={16} w={2.2} /> Complete & Send to Reception</button>
                    <button type="button" onClick={() => chairPt && wa(chairPt.phone, aftercareMsg(chairPt.name, op.procedure, op.teeth.join(", ") || "General", op.department))} className="btn btn-ok btn-lg"><Icon n="message" s={16} /> Send Aftercare on WhatsApp</button>
                  </div>
                </div>
              </form>
            )}

            {/* TAB 5: REMINDERS */}
            {tab === 5 && (
              <div className="space-y-3 max-w-4xl">
                {reminders.map(r => (
                  <div key={r.id} className="card p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4" style={r.status === "Pending" ? { borderLeft: "4px solid #e0a93a" } : { background: "#f7f9fc" }}>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-semibold text-sm">{r.patientName}</span>
                        <span className={`badge ${r.status === "Pending" ? "b-w" : "b-o"}`}>{r.status}</span>
                      </div>
                      <p className="text-xs font-medium mt-0.5" style={{ color: "var(--acc)" }}>{r.type}</p>
                      <p className="text-xs text-slate-600 mt-1.5 max-w-xl leading-relaxed">"{r.message}"</p>
                      <p className="text-[11.5px] text-slate-400 mt-1.5 flex items-center gap-1.5">{r.timing} · <Icon n="phone" s={11} /> {r.phone}</p>
                    </div>
                    <div className="flex gap-2 shrink-0">
                      <button onClick={() => sms(r.phone, r.message, r.id)} className="btn btn-d"><Icon n="send" s={13} /> SMS</button>
                      <button onClick={() => wa(r.phone, r.message)} className="btn btn-ok"><Icon n="message" s={13} /> WhatsApp</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB 6: GOOGLE REVIEWS */}
            {tab === 6 && (
              <div className="max-w-3xl card">
                <div className="card-h"><h3 className="card-t flex items-center gap-2"><Icon n="star" s={16} style={{ color: "#d99a1c" }} /> Google Maps Review Requests</h3></div>
                <div className="card-b space-y-4">
                  <p className="text-xs rounded-md p-2.5 select-all overflow-x-auto" style={{ background: "var(--warnbg)", border: "1px solid var(--warnln)", color: "var(--warn)" }}>{MAPS}</p>
                  <div className="divide">
                    {patients.map(p => {
                      const t = `Hello ${p.name}, thank you for choosing Dr. Rabia's Dental Care in Tindivanam. If you had a comfortable visit, please share a quick review on Google: ${MAPS}`;
                      return (
                        <div key={p.id} className="py-3.5 flex items-center justify-between gap-3 text-xs">
                          <div>
                            <p className="font-semibold text-[13px]">{p.name}</p>
                            <p className="text-slate-500 flex items-center gap-1.5 mt-0.5"><Icon n="phone" s={12} /> {p.phone}</p>
                          </div>
                          <div className="flex gap-2">
                            <button onClick={() => sms(p.phone, t)} className="btn btn-d"><Icon n="send" s={13} /> SMS</button>
                            <button onClick={() => wa(p.phone, t)} className="btn btn-ok"><Icon n="message" s={13} /> WhatsApp</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </main>

          <footer className="bg-white border-t py-3.5 text-center text-xs text-slate-400" style={{ borderColor: "var(--line)" }}>
            Powered by <strong className="text-slate-700">Nexus Digital Hub</strong> ({PHONE})
          </footer>
        </div>
      </div>

      {/* PRINT PREVIEW MODAL */}
      {printModalPt && (
        <div className="app-chrome overlay z-50 overflow-y-auto" style={{ zIndex: 50 }}>
          <div className="bg-white rounded-xl max-w-2xl w-full overflow-hidden flex flex-col my-auto" style={{ boxShadow: "0 24px 60px rgba(0,0,0,.4)" }}>
            <div className="text-white px-5 py-3.5 flex justify-between items-center" style={{ background: "var(--nav)" }}>
              <div className="flex items-center gap-2.5">
                <Icon n="printer" s={18} />
                <span className="text-sm font-semibold">Official Prescription Slip Preview</span>
              </div>
              <div className="flex items-center gap-2">
                <button type="button" onClick={() => window.print()} className="btn btn-p" style={{ background: "#14a89c" }}>
                  <Icon n="printer" s={14} /> Send to Printer / Save PDF
                </button>
                <button type="button" onClick={() => setPrintModalPt(null)} className="btn" style={{ background: "rgba(255,255,255,.1)", color: "#dbe6f3" }}>
                  <Icon n="x" s={14} /> Close
                </button>
              </div>
            </div>

            <div className="p-5 overflow-y-auto max-h-[75vh]" style={{ background: "#e9eef4" }}>
              <div className="bg-white p-7 rounded-md text-xs" style={{ boxShadow: "0 1px 4px rgba(15,28,46,.15)" }}>
                <div className="border-b-2 pb-3.5 mb-4 flex justify-between items-start gap-3" style={{ borderColor: "#0f766e" }}>
                  <div>
                    <h2 className="text-lg font-bold m-0" style={{ color: "#0f766e" }}>Dr. Rabia's Dental Care</h2>
                    <p className="text-[11px] text-slate-600 mt-0.5">Multi-Speciality Dental Clinic & Implant Centre · Tindivanam</p>
                    <p className="text-[10.5px] text-slate-500 mt-0.5">Ph: {PHONE}</p>
                  </div>
                  <div className="text-right text-[10.5px]">
                    <p className="text-xs font-bold m-0">Date: {lvModal?.date || "Today"}</p>
                    <p className="text-slate-600 mt-0.5">Chart No: {modalPt?.chartNo}</p>
                    <p className="font-bold mt-0.5" style={{ color: "#0f766e" }}>{lvModal?.department || "Dental Surgery"}</p>
                  </div>
                </div>

                <div className="well p-3 mb-4 flex flex-wrap justify-between gap-2 text-[11px]">
                  <div><strong>Patient:</strong> {modalPt?.name} ({modalPt?.age ? `${modalPt.age}y` : "Adult"} / {modalPt?.gender || "Female"})</div>
                  <div><strong>Phone:</strong> {modalPt?.phone}</div>
                  <div><strong>Tooth:</strong> #{lvModal?.tooth || "N/A"}</div>
                </div>

                {lvModal && <p className="mb-2.5 text-[11px]"><strong>Procedure:</strong> {lvModal.procedure}</p>}

                <div className="text-[11.5px] font-bold text-slate-700 border-b pb-1.5 mb-2.5">
                  ℞ Therapeutic Composition / Active Salt Formulation
                </div>
                <div className="border rounded-md px-3 py-1 mb-4 bg-white" style={{ borderColor: "var(--line)" }}>
                  {(lvModal?.medicines || []).map((m, i, arr) => (
                    <div key={i} className="py-2 text-[11px]" style={{ borderBottom: i === arr.length - 1 ? "none" : "1px dashed #cbd5e1" }}>
                      <div className="flex justify-between items-start gap-2">
                        <span className="font-bold text-slate-900">
                          {i + 1}. {composition(m)}{isCombo(m) ? " — Fixed-Dose Combination" : ""}
                        </span>
                        <span className="font-bold px-2 py-0.5 rounded whitespace-nowrap" style={{ color: "#0f766e", background: "#f0fdfa", border: "1px solid #ccfbf1" }}>
                          [ {doseStr(m, " — ")} ]
                        </span>
                      </div>
                      <div className="text-[10.5px] text-slate-500 mt-0.5">
                        {m.timing} · {m.days} day{m.days > 1 ? "s" : ""} course
                      </div>
                    </div>
                  ))}
                </div>

                <div className="p-3 rounded-md mb-5 text-[10.5px]" style={{ background: "#fefce8", border: "1px solid #e5d9a0" }}>
                  <p className="font-bold mb-1 ta" style={{ color: "#854d0e" }}>பல் சிகிச்சைக்குப் பின் கவனிக்க வேண்டியவை (Post-Treatment Care)</p>
                  <p className="text-slate-800 whitespace-pre-line leading-relaxed ta">{tamilFor(lvModal?.department)}</p>
                </div>

                <div className="flex justify-between items-end pt-3 border-t border-dashed border-slate-300 text-[10.5px]">
                  <div>
                    <p className="font-bold text-slate-800">Clinical record verified</p>
                    <p className="text-slate-500">Medicines are dispensed at the Clinic Pharmacy Counter</p>
                  </div>
                  <div className="text-center">
                    <p className="font-bold text-slate-900">Dr. Rabia, B.D.S.</p>
                    <p className="text-[9.5px] text-slate-500">Dental Surgeon · Reg. No: State Dental Council</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* OFFICIAL RECEPTION PRINTABLE A4 SLIP */}
      <div id="reception-rx-sheet" style={{ fontFamily: "'Inter','Noto Sans Tamil',sans-serif", padding: 8 }}>
        <div style={{ borderBottom: "2px solid #0f766e", paddingBottom: 10, marginBottom: 14, display: "flex", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 700, color: "#0f766e" }}>Dr. Rabia's Dental Care</div>
            <div style={{ fontSize: 11, color: "#475569" }}>Multi-Speciality Dental Clinic & Implant Centre · Tindivanam</div>
            <div style={{ fontSize: 10, color: "#64748b" }}>Ph: {PHONE}</div>
          </div>
          <div style={{ textAlign: "right", fontSize: 10 }}>
            <div style={{ fontSize: 11, fontWeight: 700 }}>Date: {lvModal?.date || "Today"}</div>
            <div>Chart No: {modalPt?.chartNo}</div>
            <div style={{ fontWeight: 700, color: "#0f766e" }}>{lvModal?.department || "Dental Surgery"}</div>
          </div>
        </div>

        <div style={{ background: "#f8fafc", padding: 10, borderRadius: 6, marginBottom: 14, fontSize: 11, display: "flex", justifyContent: "space-between", border: "1px solid #e2e8f0" }}>
          <div><strong>Patient:</strong> {modalPt?.name} ({modalPt?.age ? `${modalPt.age}y` : "Adult"} / {modalPt?.gender || "Female"})</div>
          <div><strong>Phone:</strong> {modalPt?.phone}</div>
          <div><strong>Tooth:</strong> #{lvModal?.tooth || "N/A"}</div>
        </div>

        {lvModal && <div style={{ fontSize: 11, marginBottom: 10 }}><strong>Procedure:</strong> {lvModal.procedure}</div>}

        <div style={{ fontSize: 12, fontWeight: 700, color: "#334155", borderBottom: "1px solid #e2e8f0", paddingBottom: 4, marginBottom: 8 }}>
          ℞ Therapeutic Composition / Salt Formulation
        </div>

        <div style={{ border: "1px solid #e2e8f0", borderRadius: 6, padding: "6px 12px", marginBottom: 14 }}>
          {(lvModal?.medicines || []).map((m, i, arr) => (
            <div key={i} style={{ padding: "7px 0", borderBottom: i === arr.length - 1 ? "none" : "1px dashed #cbd5e1", fontSize: 11 }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                <span style={{ fontWeight: 700, color: "#0f172a" }}>{i + 1}. {composition(m)}{isCombo(m) ? " — Fixed-Dose Combination" : ""}</span>
                <span style={{ fontWeight: 700, color: "#0f766e", background: "#f0fdfa", padding: "2px 6px", borderRadius: 4, border: "1px solid #ccfbf1", whiteSpace: "nowrap" }}>[ {doseStr(m, " — ")} ]</span>
              </div>
              <div style={{ fontSize: 10, color: "#64748b", marginTop: 2 }}>{m.timing} · {m.days} day{m.days > 1 ? "s" : ""} course</div>
            </div>
          ))}
        </div>
